name: 🌐 Đề xuất tối ưu website (Website Compatibility Request)
description: Yêu cầu Zento Reader tinh chỉnh giao diện cho một trang báo, diễn đàn hoặc web app cụ thể.
title: "[Site]: <Nhập tên miền hoặc URL trang web tại đây>"
labels: ["site-compatibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã đóng góp giúp Zento Reader ngày càng hoàn thiện!
        *Nếu bạn là người dùng PRO, hãy chọn phân hạng PRO để được cam kết SLA hoàn thành trong vòng 7 ngày.*

  - type: dropdown
    id: user_tier
    attributes:
      label: Bạn đang sử dụng gói nào?
      description: Người dùng Pro sẽ được xếp hàng ưu tiên xử lý trong vòng 7 ngày.
      options:
        - "👑 Zento Pro (Có License Key)"
        - "🌱 Miễn phí (Community Free)"
    validations:
      required: true

  - type: input
    id: license_key
    attributes:
      label: License Key hoặc Email đăng ký Pro (Nếu có)
      description: Ví dụ: ZEN-PRO-XXXX-XXXX hoặc dev@gmail.com. Chúng tôi dùng thông tin này để kích hoạt SLA 7 ngày.
    validations:
      required: false

  - type: input
    id: website_url
    attributes:
      label: Đường dẫn trang web gặp sự cố (URL)
      description: Dán đầy đủ đường link bạn đang đọc.
      placeholder: https://example.com/article/12345
    validations:
      required: true

  - type: checkboxes
    id: issue_type
    attributes:
      label: Vấn đề bạn nhận thấy trên trang web này là gì?
      options:
        - label: "Chữ bị tối hoặc độ tương phản khó đọc trên nền Dark/Oled"
        - label: "Hình ảnh minh họa hoặc banner bị che mờ/ám đen quá mức"
        - label: "Khung video / Facebook Reels / YouTube bị đen màn hình"
        - label: "Ảnh lazy-load không hiển thị khi cuộn nhanh"
        - label: "Mục lục thông minh (Smart TOC) không bắt được tiêu đề bài viết"
        - label: "Khác (vui lòng mô tả chi tiết bên dưới)"

  - type: textarea
    id: description
    attributes:
      label: Mô tả chi tiết vấn đề
      description: Vui lòng mô tả chi tiết cách bạn tái hiện hoặc vị trí bị lỗi trên trang web.
      placeholder: Khi mình mở bài viết trên và cuộn xuống mục 2 thì...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Ảnh chụp màn hình (Khuyên dùng)
      description: Kéo thả ảnh chụp màn hình trực tiếp vào đây để đội ngũ kỹ thuật đối soát nhanh nhất.
    validations:
      required: false
