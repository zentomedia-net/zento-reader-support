name: 🌐 Đề xuất tối ưu website (Website Compatibility Request)
description: Yêu cầu Zento Reader tinh chỉnh giao diện cho một trang báo, diễn đàn hoặc web app cụ thể.
title: "[Site]: <Nhập tên miền hoặc URL trang web tại đây>"
labels: ["site-compatibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã đóng góp giúp Zento Reader ngày càng hoàn thiện!
        *Nếu bạn là người dùng PRO, hãy nhập License Key hoặc Email để được ưu tiên xử lý trong vòng 7 ngày.*

  - type: input
    id: website_url
    attributes:
      label: Đường dẫn trang web cần tối ưu (URL)
      placeholder: https://example.com/article/12345
    validations:
      required: true

  - type: input
    id: license_or_tier
    attributes:
      label: Gói tài khoản hoặc License Key
      placeholder: "👑 Zento Pro (nhập mã ZEN-PRO-XXXX) hoặc 🌱 Miễn phí (Community Free)"
    validations:
      required: true

  - type: textarea
    id: issue_description
    attributes:
      label: Chi tiết vấn đề hiển thị trên website này
      placeholder: "Ví dụ: Khi bật chế độ Dark/Sepia, tiêu đề bài viết bị mờ, ảnh minh họa bị ám đen quá mức..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Ảnh chụp màn hình (Kéo thả ảnh trực tiếp vào đây)
      placeholder: Kéo thả file ảnh chụp màn hình vào đây để kỹ thuật đối soát nhanh nhất.
    validations:
      required: false
