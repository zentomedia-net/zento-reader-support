name: 🌐 Website Compatibility Request | Đề xuất tối ưu trang web
description: Request custom styling or layout optimization for a specific website (Yêu cầu tối ưu giao diện đọc).
title: "[Site]: <Enter domain or URL here / Nhập tên miền tại đây>"
labels: ["site-compatibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Zento Reader!
        *If you are a PRO user, please provide your License Key or Email for priority 7-day SLA resolution.*  
        *(Cảm ơn bạn đã đóng góp! Người dùng PRO vui lòng nhập License Key hoặc Email để được ưu tiên xử lý trong 7 ngày).*

  - type: input
    id: website_url
    attributes:
      label: Website URL (Đường dẫn trang web cần tối ưu)
      description: Enter the full URL where the reading issue occurs.
      placeholder: https://example.com/article/12345
    validations:
      required: true

  - type: input
    id: license_or_tier
    attributes:
      label: User Tier or License Key (Gói tài khoản hoặc License Key)
      description: e.g. ZEN-PRO-XXXX-XXXX, pro-user@example.com, or Community Free (Miễn phí).
      placeholder: "👑 Zento Pro (ZEN-PRO-XXXX) or 🌱 Community Free"
    validations:
      required: true

  - type: textarea
    id: issue_description
    attributes:
      label: Problem Details (Mô tả chi tiết vấn đề trên trang web)
      description: Describe what looks wrong (e.g. low text contrast in Dark mode, over-dimmed images, video box blacked out).
      placeholder: "When opening this article with Dark/Sepia mode, the heading text is too dark to read..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (Ảnh chụp màn hình)
      description: Drag and drop screenshots directly here (Khuyên dùng để kỹ thuật đối soát nhanh nhất).
      placeholder: Drag and drop screenshots here...
    validations:
      required: false
